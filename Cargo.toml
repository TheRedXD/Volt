[workspace]
members = ["crates/blerp", "crates/volt", "crates/volt-waveform"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

[workspace.dependencies]
cpal = "0.16.0"
itertools = "0.14.0"
thiserror = "2.0.9"
tracing = "0.1.41"

# Compile time and runtime optimizations
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
