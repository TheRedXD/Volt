[workspace]
members = ["crates/blerp", "crates/volt"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
# Volt internal deps
cpal = "0.16.0"
volt-waveform = { git = "https://github.com/TheRedXD/volt-waveform-rs", branch = "master" }
anyhow = "1.0.86"
itertools = "0.14.0"
thiserror = "2.0.12"
tracing = "0.1.41"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

# Compile time and runtime optimizations
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[patch.crates-io]
gpui = { git = "https://github.com/gpui-ce/gpui-ce" }

[patch."https://github.com/zed-industries/zed.git"]
gpui = { git = "https://github.com/gpui-ce/gpui-ce" }
